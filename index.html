<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Schulplaner</title>
<meta name="apple-mobile-web-app-title" content="Schulplaner">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#3b5bfd">
<style>
:root{--bg:#fff;--ink:#14161c;--muted:#646a78;--accent:#3b5bfd;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#14161c;--ink:#f2f3f6;--muted:#a3a9b8}}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,system-ui,sans-serif}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px max(16px,env(safe-area-inset-left));text-align:center}
img{width:96px;height:96px;border-radius:22px}
h1{margin:0;font-size:26px}
p{margin:0;color:var(--muted);max-width:30ch}
a.btn{background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:14px 24px;border-radius:14px}
ol{text-align:left;color:var(--muted);margin:0;padding-left:20px;max-width:32ch}
</style>
</head>
<body>
<main id="m">
  <img src="apple-touch-icon.png" alt="">
  <h1>Max' Schulplaner</h1>
  <p id="t">Wird geöffnet …</p>
  <a class="btn" id="go" href="https://claude.ai/artifact/8TK2D7jinx1C4aGnwy94x2">Schulplaner öffnen</a>
  <ol id="how" hidden>
    <li>Teilen-Symbol in Safari antippen</li>
    <li>„Zum Home-Bildschirm“ wählen</li>
    <li>Hinzufügen</li>
  </ol>
</main>
<script>
var url="https://claude.ai/artifact/8TK2D7jinx1C4aGnwy94x2";
if(location.search.indexOf("install")>-1){
  // Installationsmodus: nicht weiterleiten, gespeicherte Adresse ohne ?install
  document.getElementById("t").textContent="Zum Installieren:";
  document.getElementById("how").hidden=false;
  try{history.replaceState(null,"",location.pathname)}catch(e){}
}else{
  location.replace(url);
}
</script>
</body>
</html>
